<header id="PP_HDR" style="background:#0a0f0c;border-bottom:1px solid #1f2630;color:#fff;position:relative;z-index:9999;">
  <div style="max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;">
    <a href="{{ '/' | relative_url }}" style="display:flex;align-items:center;gap:10px;color:#e6f0ea;text-decoration:none;">
      <img src="{{ '/img/patchandpot-logo.png' | relative_url }}" alt="Patch & Pot" style="height:28px;width:auto">
      <strong>Patch &amp; Pot</strong>
    </a>

    <!-- PHONE-ONLY HAMBURGER (white) -->
    <button id="PP_TGL" aria-label="Toggle navigation" aria-expanded="false"
            style="background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1;padding:8px 10px;display:none;">
      &#9776;
    </button>
  </div>

  <!-- DROPDOWN NAV -->
  <nav id="PP_NAV" aria-label="Primary"
       style="display:none;position:relative;max-width:1100px;margin:0 auto 10px; padding:0 20px;">
    <div style="display:flex;flex-wrap:wrap;gap:10px;background:#0a0f0c;border:1px solid #1f2630;border-radius:10px;padding:10px;">
      {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"
           style="color:#cfe9dc;text-decoration:none;padding:6px 8px;border-radius:8px;display:inline-block;border:1px solid transparent">
           {{ item.title }}
        </a>
      {% endfor %}
    </div>
  </nav>

  <style>
    /* Show burger only on phones; keep desktop nav visible in the header row */
    @media (max-width: 820px){
      #PP_TGL{display:inline-block !important;}
      /* On phones, hide the inline header nav (we’re using the dropdown) */
      #PP_HDR .header-inline-nav{display:none !important;}
    }
    @media (min-width: 821px){
      #PP_TGL{display:none !important;}
      /* Optional: keep a single-line inline nav by duplicating links if you want.
         If you don't keep a second inline nav, the dropdown remains hidden on desktop. */
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('PP_TGL');
      var nav = document.getElementById('PP_NAV');
      if (!btn || !nav) return;
      btn.addEventListener('click', function () {
        var open = nav.style.display === 'block';
        nav.style.display = open ? 'none' : 'block';
        btn.setAttribute('aria-expanded', String(!open));
      });
    });
  </script>
</header>
