title: "Patch & Pot"
description: "Small-space growing, cooking, and calm."
url: "https://patchandpot.com"
baseurl: ""

# Write the built site into /sites (your server docroot)
destination: sites

# IMPORTANT: keep your existing assets that already live inside /sites
keep_files:
  - assets
  - img
  - pdf

# PNG logo referenced by header/footer (public URL path)
logo: /img/patchandpot-logo.png

timezone: Europe/London
markdown: kramdown
permalink: pretty

# Default layout for all pages unless overridden
defaults:
  - scope: { path: "" }
    values: { layout: default }

# No plugins required
plugins: []
