<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — Patch &amp; Pot</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/site.css?v=restored">
  <link rel="stylesheet" href="/pp-hotfix.css?v=restored">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/img/patchandpot-logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/patchandpot-logo-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/patchandpot-logo-180.png">
  <meta name="theme-color" content="#214b35">
  <meta name="description" content="{{ page.description | default: site.description }}">
</head>
<body>
  <!-- Universal header mount (one per page) -->
  <div id="site-header"></div>
  <script src="/js/header-loader.js" defer></script>

  <main id="content" role="main">
    {{ content }}
  </main>

  {% if site.footer_include %}{% include {{ site.footer_include }} %}{% endif %}
</body>
</html>
