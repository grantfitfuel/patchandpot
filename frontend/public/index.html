        <meta charset="utf-8" />

        <meta name="theme-color" content="#2D4A22" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Patch & Pot" />
        <meta property="og:image" content="https://patchandpot.app/api/share/og/brand.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Patch & Pot — AI gardening tutor" />
        <meta name="twitter:card" content="summary_large_image" />

        <!-- Favicon suite — built from the brand plant-in-pot logo used
             on patchandpot.com, so both sites share the same visual mark.
             Cache-busted via `?v=2` so browsers refetch after the swap. -->
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=2" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png?v=2" />
        <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon-180.png?v=2" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Patch &amp; Pot — AI gardening tutor that teaches you how to garden where you live</title>
        <meta name="description" content="AI gardening tutor for your patch. Ask any question and get a personalised masterclass shaped to your climate, season, space and skill. Free to try." />
        <meta property="og:title" content="Patch & Pot — AI gardening tutor" />
        <meta property="og:description" content="AI gardening tutor for your patch. Ask any question and get a personalised masterclass shaped to your climate, season, space and skill. Free to try." />
        <meta name="twitter:title" content="Patch & Pot — AI gardening tutor" />
        <meta name="twitter:description" content="AI gardening tutor for your patch. Ask any question and get a personalised masterclass shaped to your climate, season, space and skill. Free to try." />
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- Google Analytics 4 loader. Only activates when
             `REACT_APP_GA4_ID` is defined at build time — otherwise the
             substitution collapses to an empty string and the script
             short-circuits, so we don't ship a broken tag on preview. -->
        <script>
          (function(){
            var id = "%REACT_APP_GA4_ID%";
            if (!id || id.indexOf("REACT_APP") === 0) return;
            window.dataLayer = window.dataLayer || [];
            function gtag(){window.dataLayer.push(arguments);}
            window.gtag = gtag;
            gtag("js", new Date());
            // If the current URL carries `?ga_debug=1`, opt this session
            // into GA4 DebugView. DebugView shows events in real time with
            // full parameters — far better than the Realtime report for
            // end-to-end verification. The flag is per-session and never
            // stored, so production visitors are never affected.
            var isDebug = false;
            try { isDebug = new URLSearchParams(location.search).get("ga_debug") === "1"; } catch (e) {}
            // Privacy-hardened GA4 config: SPA sends page_views manually
            // below; Google Signals + ad personalisation off; IP
            // anonymisation on. Data-retention (14 months) is set in the
            // GA4 admin console.
            gtag("config", id, {
              send_page_view: false,
              anonymize_ip: true,
              allow_google_signals: false,
              allow_ad_personalization_signals: false,
              debug_mode: isDebug
            });
            var s = document.createElement("script");
            s.async = true;
            s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
            document.head.appendChild(s);
          })();
        </script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
