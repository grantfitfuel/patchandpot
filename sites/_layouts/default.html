<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords | escape }}">{% endif %}

  <!-- Social -->
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/img/patchandpot-logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" href="{{ '/img/patchandpot-logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/img/patchandpot-logo.png' | relative_url }}">

  <!-- CSS (per your structure) -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/pp-hotfix.css' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <main id="main-content" role="main">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
