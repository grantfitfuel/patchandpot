# ============================
# Patch & Pot — Jekyll Config
# ============================

title: "Patch & Pot"
description: "Small-space growing, cooking, and calm."
url: "https://patchandpot.com"    # your real domain when deployed
baseurl: ""                       # leave blank if hosted at the root

logo: /img/patchandpot-logo.png   # ✅ correct PNG path

# Optional metadata
author: "Grant Cameron Anthony"
email: ""
timezone: Europe/London
markdown: kramdown
permalink: pretty

# Include folders (ensures Jekyll processes these)
include:
  - _pages
  - _includes
  - assets
  - img
  - pdf

# Exclude things you don’t want published
exclude:
  - README.md
  - node_modules
  - Gemfile
  - Gemfile.lock

# Plugins (optional but common)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO defaults (optional)
defaults:
  -
    scope:
      path: ""
    values:
      image: /img/patchandpot-logo.png
      layout: default
