        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- Google Analytics 4 loader. Only activates when
             `REACT_APP_GA4_ID` is defined at build time — otherwise the
             substitution collapses to an empty string and the script
             short-circuits, so we don't ship a broken tag on preview. -->
        <script>
          (function(){
            var id = "%REACT_APP_GA4_ID%";
            if (!id || id.indexOf("REACT_APP") === 0) return;
            window.dataLayer = window.dataLayer || [];
            function gtag(){window.dataLayer.push(arguments);}
            window.gtag = gtag;
            gtag("js", new Date());
            gtag("config", id, { send_page_view: false });
            var s = document.createElement("script");
            s.async = true;
            s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
            document.head.appendChild(s);
          })();
        </script>
