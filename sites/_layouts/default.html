<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- Basic meta -->
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords | escape }}">{% endif %}

  <!-- Open Graph / Social -->
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.logo }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.logo }}">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="{{ site.logo | relative_url }}">
  <link rel="apple-touch-icon" href="{{ site.logo | relative_url }}">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css?v=1' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/pp-hotfix.css?v=36' | relative_url }}">

  <!-- Optional: preload fonts / scripts -->
  {% if site.fonts %}
    {% for font in site.fonts %}
      <link rel="preload" href="{{ font | relative_url }}" as="font" type="font/woff2" crossorigin>
    {% endfor %}
  {% endif %}
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {% include header.html %}

  <main id="main-content" role="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Scripts -->
  {% if site.js %}
    {% for script in site.js %}
      <script src="{{ script | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}
</body>
</html>
